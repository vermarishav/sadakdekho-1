<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SadakDekho - Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reset-container {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 320px;
      border: 1px solid #e5e7eb;
    }

    @media (max-width: 640px) {
      .reset-container {
        max-width: 85%;
        padding: 20px;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .reset-container {
        max-width: 55%;
      }
    }

    @media (min-width: 1025px) {
      .reset-container {
        max-width: 50%;
        max-width: 350px;
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    #resetForm {
      display: flex;
      flex-direction: column;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 10px 40px 10px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
      font-size: 14px;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .eye-btn:hover {
      color: #6b7280;
    }

    .eye-btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      width: 100%;
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      min-height: 44px;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-primary span {
      color: white;
      font-weight: 600;
    }

    .text-center {
      text-align: center;
    }

    .text-gray-500 {
      color: #6b7280;
    }

    .text-blue-600 {
      color: #2563eb;
    }

    .text-red-600 {
      color: #dc2626;
    }

    .text-green-600 {
      color: #16a34a;
    }

    .mb-2 {
      margin-bottom: 8px;
    }

    .mb-4 {
      margin-bottom: 16px;
    }

    .mb-8 {
      margin-bottom: 24px;
    }

    .mt-8 {
      margin-top: 24px;
    }

    .hidden {
      display: none !important;
    }

    .error-message,
    .success-message {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .error-message {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .success-message {
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-name {
      display: flex;
    }

    .f {
      display: flex;
      font-size: 26px;
      font-weight: bold;
      color: #545454;
    }

    .s {
      display: flex;
      font-size: 26px;
      font-weight: bold;
      color: #1f80ff;
    }

    .t {
      padding-bottom: 4px;
      display: flex;
      font-size: xx-small;
      flex-direction: column;
      justify-content: flex-end;
    }

    .invalid-container {
      text-align: center;
      padding: 20px;
    }

    .invalid-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800 font-sans p-4">

  <div class="reset-container bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">

    <div class="text-center mb-8">
      <div class="logo mb-2">
        <div class="logo-name">
          <span class="f">Sadak</span>
          <span class="s">Dekho</span>
          <span class="t">.com</span>
        </div>
      </div>
      <h2 class="text-xl font-semibold text-gray-800 mb-2">Reset Password</h2>
      <p class="text-gray-500 text-sm">Enter your new password below</p>
    </div>

    <div id="errorMessage"
      class="error-message hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 fade-in"
      role="alert">
    </div>

    <div id="successMessage"
      class="success-message hidden mb-4 p-3 bg-green-50 text-green-600 text-sm rounded-lg border border-green-200 fade-in"
      role="alert">
    </div>

    <div id="resetContent">
      <form id="resetForm">

        <div class="form-group">
          <label for="password" class="form-label block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required
              class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
              placeholder="Enter new password" autocomplete="new-password">
            <button type="button" class="eye-btn" onclick="togglePassword('password', this)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
          <p class="text-xs text-gray-500 mt-1">Must be at least 6 characters long</p>
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label block text-sm font-medium text-gray-700 mb-1">Confirm
            Password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" required
              class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
              placeholder="Confirm new password" autocomplete="new-password">
            <button type="button" class="eye-btn" onclick="togglePassword('confirmPassword', this)">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn"
          class="btn-primary w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center">
          <span id="btnText">Reset Password</span>
        </button>

      </form>
    </div>

    <div class="mt-8 text-center text-sm text-gray-600">
      <span>Remember your password?</span>
      <a href="login.html" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline ml-1">Back to
        Login</a>
    </div>

    <div id="successArea" class="hidden mt-6"></div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const resetForm = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const successArea = document.getElementById('successArea');
    const resetContent = document.getElementById('resetContent');

    if (!token) {
      resetContent.innerHTML = `
        <div class="invalid-container">
          <div class="invalid-icon">⚠️</div>
          <h3 class="text-lg font-semibold text-gray-800 mb-2">Invalid Reset Link</h3>
          <p class="text-sm text-gray-600 mb-4">
            This reset link is invalid or has expired.<br>
            Please request a new one.
          </p>
          <a href="forgot.html" 
            class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all">
            Request New Link
          </a>
        </div>
      `;
      document.querySelector('.mt-8').style.display = "none";
    }

    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      successMessage.classList.add('hidden');
    }

    function showSuccess(message) {
      successMessage.textContent = message;
      successMessage.classList.remove('hidden');
      errorMessage.classList.add('hidden');
    }

    function hideMessages() {
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');
      errorMessage.textContent = '';
      successMessage.textContent = '';
    }

    const EYE_OPEN = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
    `;

    const EYE_CLOSED = `
      <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.105-3.568M9.88 9.88A3 3 0 0114.12 14.12M3 3l18 18"/>
    `;

    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const svg = btn.querySelector("svg");

      if (input.type === "password") {
        input.type = "text";
        svg.innerHTML = EYE_CLOSED;
      } else {
        input.type = "password";
        svg.innerHTML = EYE_OPEN;
      }
    }

    if (resetForm) {
      resetForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        hideMessages();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (!password || !confirmPassword) {
          showError("Please fill in both password fields.");
          return;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters long.");
          return;
        }

        if (password !== confirmPassword) {
          showError("Passwords do not match.");
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = "Resetting...";

        try {
          const res = await fetch("/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword: password })
          });

          const data = await res.json();

          if (data.success) {
            resetForm.style.display = "none";
            document.querySelector('.mt-8').style.display = "none";

            successArea.innerHTML = `
              <div class="text-center">
                <div class="w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto text-2xl mb-4">
                  ✓
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Password Reset Successfully!</h3>
                <p class="text-sm text-gray-600 mb-4">
                  Your password has been updated.<br>
                  You can now login with your new password.
                </p>
                <a href="login.html" 
                  class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all">
                  Go to Login
                </a>
              </div>
            `;
            successArea.classList.remove('hidden');

          } else {
            showError(data.message || "Reset link has expired. Please request a new one.");
            submitBtn.disabled = false;
            btnText.textContent = "Reset Password";
          }

        } catch (err) {
          console.error("Reset password request failed:", err);
          showError("Unable to connect to the server. Please check your internet connection.");
          submitBtn.disabled = false;
          btnText.textContent = "Reset Password";
        }
      });
    }

    window.togglePassword = togglePassword;
  </script>

</body>

</html>
