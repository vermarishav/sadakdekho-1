<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
html, body {
  margin: 0;
  padding: 10px;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background-color: #1f80ff;
}

/* ── floating message fixed at top ── */
#msg {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
  z-index: 9999;
}
#msg.success {
  opacity: 1;
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}
#msg.error {
  opacity: 1;
  background: #ffebee;
  color: #c62828;
  border: 1px solid #ef9a9a;
}

/* ── original form sizes ── */
.resetbox {
  padding: 10px;
  background-color: white;
  box-shadow: rgba(0, 0, 0, 0.16) 0px 3px 6px, rgba(0, 0, 0, 0.23) 0px 3px 6px;
  border-radius: 5px;
  border: 1px solid rgba(36, 39, 44, .3);
}
.resetbox header {
  font-size: large;
  display: flex;
  justify-content: center;
}
.formbox {
  padding: 10px;
  display: grid;
  gap: 10px;
}

/* ── input with eye toggle, original height ── */
.input-wrap {
  position: relative;
}
.input-wrap input {
  width: 100%;
  height: 40px;
  padding: 0 36px 0 10px;
  border-radius: 5px;
  border: 1px solid rgba(36, 39, 44, .3);
}
.eye-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  padding: 0;
  width: auto;
  height: auto;
  cursor: pointer;
  color: #aaa;
  display: flex;
  align-items: center;
}
.eye-btn:hover { color: #555; }
.eye-btn svg { width: 18px; height: 18px; }

button#btn {
  height: 30px;
  background-color: #1f80ff;
  border-radius: 5px;
  border: none;
  width: 100%;
  color: white;
  font-size: medium;
  cursor: pointer;
}
button#btn:disabled { opacity: .6; cursor: not-allowed; }

.back-link {
  text-align: center;
  margin-top: 10px;
  font-size: 13px;
  color: #888;
  padding: 0 10px 10px;
}
.back-link a {
  color: #1f80ff;
  text-decoration: none;
  font-weight: 500;
}
.invalid-box {
  text-align: center;
  padding: 10px;
}
.invalid-box .icon { font-size: 48px; margin-bottom: 12px; }
.invalid-box p { font-size: 14px; color: #888; margin-bottom: 16px; }
</style>
<body>

<!-- ✅ fixed at top, outside resetbox -->
<div id="msg"></div>

<div class="resetbox" id="resetbox">
  <header>Reset Password</header>
  <div class="formbox" id="formbox">

    <div class="input-wrap">
      <input type="password" id="password" placeholder="New password">
      <button class="eye-btn" type="button" onclick="toggleEye('password', this)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
      </button>
    </div>

    <div class="input-wrap">
      <input type="password" id="confirmPassword" placeholder="Confirm new password">
      <button class="eye-btn" type="button" onclick="toggleEye('confirmPassword', this)">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
      </button>
    </div>

    <button id="btn" onclick="resetPassword()">Reset Password</button>
  </div>
  <div class="back-link">
    Remember your password? <a href="login.html">Login</a>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token  = params.get("token");

if (!token) {
  document.getElementById("resetbox").innerHTML = `
    <div class="invalid-box">
      <div class="icon">⚠️</div>
      <header>Invalid Link</header>
      <p>This reset link is invalid or has expired.<br>Please request a new one.</p>
      <a href="forgot.html"><button id="btn">Request New Link</button></a>
    </div>
  `;
}

let msgTimer;
function showMsg(text, type) {
  const msg = document.getElementById("msg");
  msg.className = type;
  msg.innerText = text;
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => { msg.className = ""; msg.innerText = ""; }, 3000);
}

const EYE_OPEN = `
  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
`;
const EYE_CLOSED = `
  <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.105-3.568M9.88 9.88A3 3 0 0114.12 14.12M3 3l18 18"/>
`;

function toggleEye(inputId, btn) {
  const input = document.getElementById(inputId);
  const svg   = btn.querySelector("svg");
  if (input.type === "password") {
    input.type    = "text";
    svg.innerHTML = EYE_CLOSED;
  } else {
    input.type    = "password";
    svg.innerHTML = EYE_OPEN;
  }
}

async function resetPassword() {
  const password        = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const btn             = document.getElementById("btn");

  if (!password || !confirmPassword) {
    showMsg("Please fill in both fields", "error");
    return;
  }
  if (password.length < 6) {
    showMsg("Password must be at least 6 characters", "error");
    return;
  }
  if (password !== confirmPassword) {
    showMsg("Passwords do not match", "error");
    return;
  }

  btn.disabled  = true;
  btn.innerText = "Resetting...";

  try {
    const res  = await fetch("/reset-password", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, newPassword: password })
    });
    const data = await res.json();

    if (data.success) {
      showMsg("✔ Password reset! Redirecting...", "success");
      document.getElementById("password").closest(".input-wrap").style.display        = "none";
      document.getElementById("confirmPassword").closest(".input-wrap").style.display = "none";
      btn.style.display = "none";
      setTimeout(() => window.location.replace("login.html"), 2000);
    } else {
      showMsg(data.message || "Link expired. Please request a new one.", "error");
      btn.disabled  = false;
      btn.innerText = "Reset Password";
    }
  } catch {
    showMsg("Server error. Please try again.", "error");
    btn.disabled  = false;
    btn.innerText = "Reset Password";
  }
}
</script>
</body>
</html>
