<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SadakDekho Login</title>
  <!-- Using Tailwind CSS for modern, responsive styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom transition for the error message */
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800 font-sans p-4">

  <!-- Main Login Container -->
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-600 mb-2">SadakDekho</h1>
      <p class="text-gray-500">Welcome back! Please login to your account.</p>
    </div>

    <!-- Error Message Container (Hidden by default) -->
    <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 fade-in" role="alert">
      <!-- Error text injected here via JS -->
    </div>

    <!-- 
      Semantic HTML: Using a <form> tag is crucial for password managers 
      to detect the form, and allows users to hit 'Enter' to submit. 
    -->
    <form id="loginForm" class="space-y-5">
      
      <!-- Email Field -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email"
          required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>

      <!-- Password Field -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password"
          required
          class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          placeholder="••••••••"
          autocomplete="current-password"
        >
      </div>

      <!-- Forgot Password Link -->
      <div class="flex justify-end">
        <a href="forgot.html" class="text-sm text-blue-600 hover:text-blue-800 hover:underline transition-colors">
          Forgot password?
        </a>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center"
      >
        <span id="btnText">Login</span>
      </button>

    </form>

    <!-- Signup Redirect -->
    <div class="mt-8 text-center text-sm text-gray-600">
      <span>Don't have an account?</span>
      <a href="signup.html" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline ml-1">Sign up</a>
    </div>
  </div>

  <script>
    // DOM Elements
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorMessage = document.getElementById('errorMessage');

    // Utility to show inline errors
    function showError(message) {
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
    }

    // Utility to hide errors
    function hideError() {
      errorMessage.classList.add('hidden');
      errorMessage.textContent = '';
    }

    // 1. Consolidated Auth Check
    // Removed the duplicate 'checkLogin' function. We only need one.
    async function checkAuthStatus() {
      try {
        const res = await fetch("/profile", { credentials: "include" });
        if (!res.ok) return; // Non-200 response, not logged in
        
        const data = await res.json();
        if(data.success) {
          window.location.href = "index.html"; // Redirect if already authenticated
        }
      } catch (err) {
        console.log("User is not currently authenticated.");
      }
    }

    // Run auth check on load
    window.addEventListener('DOMContentLoaded', checkAuthStatus);

    // 2. Form Submission Handler
    loginForm.addEventListener('submit', async function(e) {
      // Prevent default form submission (page reload)
      e.preventDefault();
      
      hideError();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // Basic front-end validation (HTML5 'required' handles most of this, but it's good to be safe)
      if (!email || !password) {
        showError("Please fill in both email and password.");
        return;
      }

      // UI Loading State
      submitBtn.disabled = true;
      btnText.textContent = "Logging in...";

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          // CSRF Note: In a production environment, you should also include a CSRF token in the headers here.
          body: JSON.stringify({ email, password })
        });

        // Handle non-JSON server errors (e.g., 502 Bad Gateway)
        if (!res.ok && res.status >= 500) {
           throw new Error("Server error occurred. Please try again later.");
        }

        const data = await res.json();
        
        if (data.success) {
          // Success! Redirecting...
          btnText.textContent = "Success!";
          window.location.href = "index.html";
        } else {
          // Display safe, server-provided error message or fallback
          showError(data.message || "Invalid email or password.");
          submitBtn.disabled = false;
          btnText.textContent = "Login";
        }
      } catch (err) {
        console.error("Login request failed:", err);
        showError("Unable to connect to the server. Please check your internet connection.");
        submitBtn.disabled = false;
        btnText.textContent = "Login";
      }
    });
  </script>
</body>
</html>
