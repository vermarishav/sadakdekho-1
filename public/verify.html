<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SadakDekho - Verify Email</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:"Poppins",Sans-Serif; }
    html,body { margin:0; padding:10px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; background-color:#1f80ff; }
    .loginbox { padding:10px; background-color:white; box-shadow:rgba(0,0,0,0.16) 0px 3px 6px,rgba(0,0,0,0.23) 0px 3px 6px; border-radius:5px; border:1px solid rgba(36,39,44,.3); width:320px; text-align:center; }
    .logintext { text-align:center; font-size:x-large; padding:10px; }
    .icon-wrap { display:flex; justify-content:center; padding:14px 10px 6px; }
    .icon-circle { width:64px; height:64px; border-radius:50%; background-color:#1f80ff; display:flex; align-items:center; justify-content:center; }
    .icon-circle svg { width:32px; height:32px; fill:white; }
    .spin { width:32px; height:32px; border:3px solid rgba(255,255,255,0.3); border-top:3px solid white; border-radius:50%; animation:spin .75s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .msg-box { padding:10px 16px; font-size:smaller; color:#444; line-height:1.5; }
    .loginbtn { padding:10px; display:flex; justify-content:center; }
    .loginbtn a { height:30px; background-color:#e53935; width:100%; color:white; font-size:medium; font-family:"Poppins",Sans-Serif; border-radius:5px; text-decoration:none; display:flex; align-items:center; justify-content:center; }
    .signupgo { text-align:center; font-size:smaller; padding:10px 20px 20px; }
    .signupgo a { color:#1f80ff; text-decoration:none; }
    #countdown { font-size:smaller; color:#1f80ff; padding:4px 10px 10px; }
  </style>
</head>
<body>
<div class="loginbox">
  <div class="icon-wrap">
    <div class="icon-circle" id="iconCircle"><div class="spin"></div></div>
  </div>
  <div class="logintext"><span id="titleText"><b>Verifying...</b></span></div>
  <div class="msg-box" id="msgText">Please wait while we verify your email address.</div>
  <div id="countdown"></div>
  <div class="loginbtn" id="btnBox" style="display:none;"><a href="signup.html">Signup Again</a></div>
  <div class="signupgo" id="bottomLink" style="display:none;"><a href="login.html">Go to Login</a></div>
</div>
<script>
  const CHECK = '<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';
  const token = new URLSearchParams(location.search).get("token");

  if (!token) {
    showResult(false, "Invalid Link", "No token found. Please signup again.");
  } else {
    fetch("/verify-email?token=" + token)
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          showResult(true, "Account Created!", "Welcome to SadakDekho! Taking you to the app...");
          startCountdown();
        } else {
          showResult(false, "Link Invalid", data.message);
        }
      })
      .catch(() => showResult(false, "Server Error", "Something went wrong. Please try again."));
  }

  function showResult(success, title, msg) {
    const circle = document.getElementById("iconCircle");
    circle.innerHTML = success ? CHECK : CROSS;
    circle.style.backgroundColor = success ? "#1f80ff" : "#e53935";
    document.getElementById("titleText").innerHTML = "<b>" + title + "</b>";
    document.getElementById("msgText").innerText = msg;
    if (!success) {
      document.getElementById("btnBox").style.display = "flex";
      document.getElementById("bottomLink").style.display = "block";
    }
  }

  function startCountdown() {
    let secs = 3;
    const el = document.getElementById("countdown");
    el.innerText = "Redirecting in " + secs + "s...";
    const t = setInterval(() => {
      secs--;
      if (secs <= 0) { clearInterval(t); window.location.replace = "index.html"; }
      else el.innerText = "Redirecting in " + secs + "s...";
    }, 1000);
  }
</script>
</body>
</html>
