<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SadakDekho - Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .forgot-container {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 320px;
      border: 1px solid #e5e7eb;
    }

    @media (max-width: 640px) {
      .forgot-container {
        max-width: 85%;
        padding: 20px;
      }
    }

    @media (min-width: 641px) and (max-width: 1024px) {
      .forgot-container {
        max-width: 55%;
      }
    }

    @media (min-width: 1025px) {
      .forgot-container {
        max-width: 50%;
        max-width: 350px;
      }
    }

    .form-group {
      margin-bottom: 20px;
    }

    #forgotForm {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      outline: none;
      transition: all 0.2s;
      box-sizing: border-box;
      font-size: 14px;
    }

    .form-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .btn-primary {
      width: 100%;
      background-color: #2563eb;
      color: white;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      min-height: 44px;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-primary:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-primary span {
      color: white;
      font-weight: 600;
    }

    .text-center {
      text-align: center;
    }

    .text-gray-500 {
      color: #6b7280;
    }

    .text-blue-600 {
      color: #2563eb;
    }

    .text-red-600 {
      color: #dc2626;
    }

    .text-green-600 {
      color: #16a34a;
    }

    .mb-2 {
      margin-bottom: 8px;
    }

    .mb-4 {
      margin-bottom: 16px;
    }

    .mb-8 {
      margin-bottom: 24px;
    }

    .mt-8 {
      margin-top: 24px;
    }

    .hidden {
      display: none !important;
    }

    .error-message,
    .success-message {
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .error-message {
      background-color: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .success-message {
      background-color: #f0fdf4;
      color: #16a34a;
      border: 1px solid #bbf7d0;
    }

    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-name {
      display: flex;
    }

    .f {
      display: flex;
      font-size: 26px;
      font-weight: bold;
      color: #545454;
    }

    .s {
      display: flex;
      font-size: 26px;
      font-weight: bold;
      color: #1f80ff;
    }

    .t {
      padding-bottom: 4px;
      display: flex;
      font-size: xx-small;
      flex-direction: column;
      justify-content: flex-end;
    }
  </style>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800 font-sans p-4">
  <div class="forgot-container bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">

    <div class="text-center mb-8">
      <div class="logo mb-2">
        <div class="logo-name">
          <span class="f">Sadak</span>
          <span class="s">Dekho</span>
          <span class="t">.com</span>
        </div>
      </div>
      <h2 class="text-xl font-semibold text-gray-800 mb-2">Forgot Password?</h2>
      <p class="text-gray-500 text-sm">Enter your email and we'll send you a reset link</p>
    </div>
    <div id="errorMessage"
      class="error-message hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 fade-in"
      role="alert">
    </div>
    <div id="successMessage"
      class="success-message hidden mb-4 p-3 bg-green-50 text-green-600 text-sm rounded-lg border border-green-200 fade-in"
      role="alert">
    </div>
    <form id="forgotForm">

      <div class="form-group">
        <label for="email" class="form-label block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" id="email" name="email" required
          class="form-input w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
          placeholder="Enter your email address" autocomplete="email">
      </div>

      <button type="submit" id="submitBtn"
        class="btn-primary w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all disabled:opacity-70 disabled:cursor-not-allowed flex justify-center items-center">
        <span id="btnText">Send Reset Link</span>
      </button>

    </form>
    <div class="mt-8 text-center text-sm text-gray-600">
      <span>Remember your password?</span>
      <a href="login.html" class="text-blue-600 hover:text-blue-800 font-semibold hover:underline ml-1">Back to
        Login</a>
    </div>

    <div id="successArea" class="hidden mt-6"></div>

  </div>

  <script>
    console.log("Forgot password script loaded");
    
    const forgotForm = document.getElementById('forgotForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorMessage = document.getElementById('errorMessage');
    const successMessage = document.getElementById('successMessage');
    const successArea = document.getElementById('successArea');

    console.log("Elements found:", {
      forgotForm: !!forgotForm,
      submitBtn: !!submitBtn,
      btnText: !!btnText
    });

    function showError(message) {
      console.log("Showing error:", message);
      errorMessage.textContent = message;
      errorMessage.classList.remove('hidden');
      successMessage.classList.add('hidden');
    }

    function showSuccess(message) {
      console.log("Showing success:", message);
      successMessage.textContent = message;
      successMessage.classList.remove('hidden');
      errorMessage.classList.add('hidden');
    }

    function hideMessages() {
      errorMessage.classList.add('hidden');
      successMessage.classList.add('hidden');
      errorMessage.textContent = '';
      successMessage.textContent = '';
    }

    if (forgotForm) {
      forgotForm.addEventListener('submit', async function (e) {
        console.log("Form submitted");
        e.preventDefault();
        e.stopPropagation();
        
        hideMessages();

        const email = document.getElementById("email").value.trim();
        console.log("Email entered:", email);

        if (!email) {
          showError("Please enter your email address.");
          return;
        }

        if (!email.includes('@')) {
          showError("Please enter a valid email address.");
          return;
        }

        submitBtn.disabled = true;
        btnText.textContent = "Sending...";
        console.log("Making API request to /forgot-password");

        try {
          const res = await fetch("/forgot-password", {
            method: "POST",
            headers: { 
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({ email })
          });

          console.log("Response status:", res.status);
          console.log("Response headers:", res.headers);

          if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
          }

          const data = await res.json();
          console.log("Response data:", data);

          if (data.success) {
            console.log("Success - hiding form and showing success area");
            forgotForm.style.display = "none";
            document.querySelector('.mt-8').style.display = "none";

            successArea.innerHTML = `
              <div class="text-center">
                <div class="w-16 h-16 bg-green-500 text-white rounded-full flex items-center justify-center mx-auto text-2xl mb-4">
                  ✓
                </div>
                <h3 class="text-lg font-semibold text-gray-800 mb-2">Reset Link Sent!</h3>
                <p class="text-sm text-gray-600 mb-4">
                  We've sent a password reset link to your email.<br>
                  Check your inbox and follow the instructions.
                </p>
                <a href="login.html" 
                  class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-all">
                  Back to Login
                </a>
              </div>
            `;
            successArea.classList.remove('hidden');

          } else {
            console.log("API returned success: false");
            showError(data.message || "Account not found. Please check your email address.");
            submitBtn.disabled = false;
            btnText.textContent = "Send Reset Link";
          }

        } catch (err) {
          console.error("Forgot password request failed:", err);
          showError("Unable to connect to the server. Please check your internet connection.");
          submitBtn.disabled = false;
          btnText.textContent = "Send Reset Link";
        }
      });
    } else {
      console.error("Form not found!");
    }

    // Also add event listener to button as backup
    if (submitBtn) {
      submitBtn.addEventListener('click', function(e) {
        console.log("Button clicked");
        if (forgotForm) {
          e.preventDefault();
          forgotForm.dispatchEvent(new Event('submit'));
        }
      });
    }

    // Test API endpoint availability
    window.addEventListener('load', function() {
      console.log("Page loaded, testing API endpoint...");
      fetch("/forgot-password", {
        method: "OPTIONS"
      }).then(res => {
        console.log("API endpoint test - Status:", res.status);
      }).catch(err => {
        console.log("API endpoint test failed:", err);
      });
    });
  </script>

</body>

</html>
