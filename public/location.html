<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SadakDekho - Location</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Plus Jakarta Sans',sans-serif;
  background:#f5f7fb;
}

/* 🎥 NORMAL */
.video-container{
  position:relative;
  width:100%;
  background:black;
}

#videoPlayer{
  width:100%;
  max-height:420px;
  background:black;
  pointer-events:none;
}

/* ❌ REMOVE UI */
#videoPlayer::-webkit-media-controls{
  display:none !important;
}

/* 🔒 BLOCK CLICK */
.video-blocker{
  position:absolute;
  inset:0;
  z-index:5;
}

/* 🔍 EXPAND BUTTON */
#expandBtn{
  position:absolute;
  bottom:12px;
  right:12px;
  background:rgba(0,0,0,0.6);
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  z-index:10000;
  font-size:18px;
  line-height:1;
}

/* Keep button visible and repositioned in fullscreen */
.fullscreen-mode #expandBtn{
  position:fixed;
  bottom:16px;
  right:16px;
  z-index:9999999;
}

/* 🔥 FULLSCREEN MODE */
.fullscreen-mode{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:black;
  z-index:999999;
  overflow:hidden;
}

/*
  When rotated 90deg:
    - The video's visual width becomes the screen HEIGHT
    - The video's visual height becomes the screen WIDTH
  So we set:
    width  = 100vh  (fills the screen's height after rotation)
    height = 100vw  (fills the screen's width after rotation)
  This makes it perfectly fill the screen with no black bars.
*/
.fullscreen-mode #videoPlayer{
  position:absolute;
  top:50%;
  left:50%;
  width:100vh;
  height:100vw;
  max-height:none;
  transform:translate(-50%, -50%) rotate(90deg);
  transform-origin:center center;
  object-fit:cover;
  pointer-events:none;
}



/* ⏳ SPINNER */
#videoSpinner{
  display:flex;
  align-items:center;
  justify-content:center;
  position:absolute;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,0.55);
}

#videoSpinner.hidden{
  display:none;
}

.spinner-ring{
  width:44px;
  height:44px;
  border:4px solid rgba(255,255,255,0.2);
  border-top-color:white;
  border-radius:50%;
  animation:spin 0.75s linear infinite;
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

/* Info skeleton while API loads */
.skeleton{
  background:linear-gradient(90deg,#e0e0e0 25%,#f0f0f0 50%,#e0e0e0 75%);
  background-size:200% 100%;
  animation:shimmer 1.2s infinite;
  border-radius:6px;
}

@keyframes shimmer{
  0%{ background-position:200% 0; }
  100%{ background-position:-200% 0; }
}

#placeName.skeleton{
  height:24px;
  width:60%;
}

#placeDesc.skeleton{
  height:14px;
  width:85%;
  margin-top:10px;
}

/* ℹ️ INFO */
#infoBox{
  padding:18px;
  background:white;
}
#placeName{
  margin:0;
  font-size:20px;
  font-weight:700;
}
#placeDesc{
  margin-top:8px;
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<div class="video-container" id="videoContainer">
  <video id="videoPlayer" playsinline muted></video>
  <div id="videoSpinner"><div class="spinner-ring"></div></div>
  <div class="video-blocker"></div>
  <button id="expandBtn" onclick="toggleFullscreen()">⛶</button>
</div>

<div id="infoBox">
  <h2 id="placeName" class="skeleton"> </h2>
  <p id="placeDesc" class="skeleton"> </p>
</div>

<script>

// 🔄 LOAD DATA
async function loadLocation(){
  const params = new URLSearchParams(window.location.search);
  const spinner = document.getElementById("videoSpinner");
  const placeName = document.getElementById("placeName");
  const placeDesc = document.getElementById("placeDesc");

  let query = "";
  if(params.get("place")){
    query = `place=${params.get("place")}`;
  } else if(params.get("lat")){
    query = `lat=${params.get("lat")}&lng=${params.get("lng")}`;
  }

  try{
    const res = await fetch(`/api/locationVideo?${query}`);
    const data = await res.json();

    if(!data.success){
      spinner.classList.add("hidden");
      placeName.classList.remove("skeleton");
      placeName.innerText = "No video found";
      placeDesc.classList.remove("skeleton");
      placeDesc.innerText = "";
      return;
    }

    const video = document.getElementById("videoPlayer");
    video.src = data.video;

    // Hide spinner once video frame is ready
    video.addEventListener("loadeddata", () => {
      spinner.classList.add("hidden");
    });

    // Show spinner again if buffering mid-seek
    video.addEventListener("waiting", () => {
      spinner.classList.remove("hidden");
    });

    video.addEventListener("canplay", () => {
      spinner.classList.add("hidden");
    });

    video.addEventListener("loadedmetadata", () => {
      if(data.timestamp){
        video.currentTime = data.timestamp;
      }
    });

    // Remove skeletons and show real info
    placeName.classList.remove("skeleton");
    placeName.innerText = data.name;

    placeDesc.classList.remove("skeleton");
    placeDesc.innerText = data.description;

  }catch(err){
    console.error(err);
    spinner.classList.add("hidden");
    placeName.classList.remove("skeleton");
    placeName.innerText = "Error loading";
    placeDesc.classList.remove("skeleton");
    placeDesc.innerText = "";
  }
}

loadLocation();


// 🚫 BLOCK PLAY
const video = document.getElementById("videoPlayer");

video.addEventListener("play", () => {
  video.pause();
});

video.addEventListener("click", (e)=>{
  e.preventDefault();
});


// 🔁 TOGGLE FULLSCREEN
function toggleFullscreen(){
  const container = document.getElementById("videoContainer");
  const isFullscreen = container.classList.contains("fullscreen-mode");

  if(isFullscreen){
    container.classList.remove("fullscreen-mode");
    document.body.style.overflow = "";
  } else {
    container.classList.add("fullscreen-mode");
    document.body.style.overflow = "hidden";
  }
}

</script>

</body>
</html>
